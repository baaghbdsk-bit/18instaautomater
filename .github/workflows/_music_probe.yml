name: music probe (temporary)

on:
  push:
    paths:
      - .github/workflows/_music_probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore sessions
        uses: actions/cache@v4
        with:
          path: sessions
          key: ig-sessions-v3-${{ github.run_id }}
          restore-keys: ig-sessions-v3-
      - name: Seed sessions
        env:
          IG_USERNAME_1: ${{ secrets.IG_USERNAME_1 }}
          IG_SESSION_1: ${{ secrets.IG_SESSION_1 }}
        run: python bootstrap_sessions.py
      - name: Probe catalog
        env:
          IG_USERNAME_1: ${{ secrets.IG_USERNAME_1 }}
          IG_PASSWORD_1: ${{ secrets.IG_PASSWORD_1 }}
        run: |
          python - <<'PY' > music-probe.txt 2>&1
          import config
          from post_instagram import login_account
          cl = login_account(config.ACCOUNTS[0])
          print("=== PICK TEST ===")
          import music_match
          track, tid = music_match.pick_orgavsm_track(cl, mood="flirty")
          print("PICKED", tid, getattr(track, "title", None),
                getattr(track, "display_artist", None))
          print("=== RAW SEARCH ===")
          for q in ("slowburn", "orgavsm", "naughty orgavsm"):
              try:
                  tracks = list(cl.search_music(q) or [])
                  print(f"QUERY {q!r} -> {len(tracks)}")
                  for t in tracks[:8]:
                      print(" ",
                            getattr(t, "id", None),
                            repr(getattr(t, "title", None)),
                            repr(getattr(t, "display_artist", None)),
                            "audio_url=", bool(getattr(t, "progressive_download_url", None)),
                            "dash=", bool(getattr(t, "dash_manifest", None)))
              except Exception as e:
                  print("QUERY", q, "ERR", type(e).__name__, str(e)[:300])
          PY
          cat music-probe.txt
      - name: Commit probe
        run: |
          git config user.name "insta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f music-probe.txt
          git commit -m "chore: music probe [skip ci]" || true
          for i in 1 2 3; do git push && break || git pull --rebase --autostash; done
