name: Scheduled quote post (Instagram 3x/day cookie-only)

on:
  schedule:
    # 3x/day IST (10:30 AM, 5:30 PM, 9:30 PM IST); trigger 10 min early at :50
    - cron: "50 4,11,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: false
      theme:
        description: "Force a content theme (empty = auto)"
        type: string
        default: ""
      slot:
        description: "Run label for the runs table"
        type: string
        default: "manual"

permissions:
  contents: write

# Never cancel mid-publish: an interrupted upload is exactly how an
# unreconciled post happens. Runs queue instead.
concurrency:
  group: insta-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (runner images no longer ship it)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Verify ffmpeg has libass
        run: |
          ffmpeg -hide_banner -filters | grep -E ' ass | subtitles ' \
            || { echo "::error::ffmpeg lacks libass (ass/subtitles filter)"; exit 1; }

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest -q

      # Session cookies are auth material: cached (7-day eviction bounds the
      # number of entries) but NEVER committed to the repo.
      - name: Restore Instagram sessions
        uses: actions/cache@v4
        with:
          path: sessions
          key: ig-sessions-v4-${{ github.run_id }}
          restore-keys: ig-sessions-v4-

      # A datacenter IP cannot clear an Instagram challenge, so seed the
      # session from an encrypted secret exported on the machine that logged
      # in. A session already present in the Actions cache wins, so a session
      # refreshed by a previous run is never downgraded.
      - name: Seed Instagram sessions from secrets
        env:
          IG_USERNAME_1: ${{ secrets.IG_USERNAME_1 }}
          IG_USERNAME_2: ${{ secrets.IG_USERNAME_2 }}
          IG_SESSION_1: ${{ secrets.IG_SESSION_1 }}
          IG_SESSION_2: ${{ secrets.IG_SESSION_2 }}
        run: python bootstrap_sessions.py

      - name: Start Perchance image API (xvfb — it launches headful Chrome)
        run: |
          sudo apt-get install -y -qq xvfb
          # DrissionPage needs a real Chrome/Chromium binary
          if ! command -v google-chrome >/dev/null 2>&1 && \
             ! command -v chromium-browser >/dev/null 2>&1 && \
             ! command -v chromium >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          fi
          command -v google-chrome || command -v chromium || true
          git clone --depth 1 https://github.com/afrozthalam/Perchance-API.git
          pip install -q -r Perchance-API/requirements.txt
          nohup xvfb-run -a -s "-screen 0 1280x1024x24" \
            python Perchance-API/app.py > perchance.log 2>&1 &
          # /v1/health answers 200 while the browser pool is still warming;
          # wait for the pool to report ready (up to 150s).
          for i in $(seq 1 75); do
            if curl -sf http://127.0.0.1:8000/v1/health | grep -q '"ready": *true'; then
              echo "Perchance ready after ~$((i*2))s"; break
            fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8000/v1/health | grep -q '"ready": *true'; then
            echo "::error::Perchance browser pool never became ready"
            tail -n 120 perchance.log || true
            exit 1
          fi

      - name: Generate, render, post
        env:
          INSTAGRAM_COOKIES_BASE64: ${{ secrets.INSTAGRAM_COOKIES_BASE64 }}
          IG_USERNAME_1: ${{ secrets.IG_USERNAME_1 }}
          IG_PASSWORD_1: ${{ secrets.IG_PASSWORD_1 }}
          IG_2FA_SECRET_1: ${{ secrets.IG_2FA_SECRET_1 }}
          IG_USERNAME_2: ${{ secrets.IG_USERNAME_2 }}
          IG_PASSWORD_2: ${{ secrets.IG_PASSWORD_2 }}
          IG_2FA_SECRET_2: ${{ secrets.IG_2FA_SECRET_2 }}
          IG_PROXY: ${{ secrets.IG_PROXY }}
          IG_HANDLE_1: ${{ vars.IG_HANDLE_1 || '@xene_hotty' }}
          IG_HANDLE_2: ${{ vars.IG_HANDLE_2 || '@panda_fcuk' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          MIN_GAP_MINUTES: '180'
          DAILY_CAP_PER_ACCOUNT: '3'
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'perchance' }}
          PERCHANCE_URL: ${{ vars.PERCHANCE_URL || 'http://127.0.0.1:8000' }}
          PERCHANCE_STYLE: 'Casual Photo'
          PERCHANCE_GUIDANCE: '7'
          QUOTE_LOW_WATERMARK: ${{ vars.QUOTE_LOW_WATERMARK || '20' }}
          CHARACTER_ID: ${{ vars.CHARACTER_ID || 'meera-v1' }}
          MUSIC_ENABLED: ${{ vars.MUSIC_ENABLED || '1' }}
          MUSIC_SOURCE: ${{ vars.MUSIC_SOURCE || 'trending' }}
          MUSIC_SEARCH_QUERY: ${{ vars.MUSIC_SEARCH_QUERY || 'trending' }}
          REEL_DURATION: ${{ vars.REEL_DURATION || '12' }}
          ALLOW_PLACEHOLDER: '0'
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.theme }}" ]; then EXTRA_ARGS="$EXTRA_ARGS --theme ${{ inputs.theme }}"; fi
          python run_all_accounts.py --strict --slot "${{ inputs.slot || 'cron' }}" --mode reel --only account_1

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_id }}
          path: |
            assets/output/*.mp4
            assets/images/*.jpg
            assets/final/*.jpg
            perchance.log
          retention-days: 3
          if-no-files-found: ignore

      # Persist engine state (posts/lines/usage) — this is the whole
      # duplicate-post + rotation memory, and it keeps the repo active so
      # GitHub does not disable the schedule after 60 idle days.
      - name: Commit engine state
        if: always()
        run: |
          git config user.name "insta-bot"
          git config user.email "actions@users.noreply.github.com"
          python -c "import db; db.checkpoint()"
          for i in 1 2 3; do
            git add -A data
            if git diff --cached --quiet; then
              echo "No state changes"
              break
            fi
            git commit -m "state: run ${{ github.run_id }} [skip ci]" && \
              git push && break || {
              echo "push rejected, rebasing (attempt $i)"
              git pull --rebase --autostash
            }
          done

      - name: Dump Perchance log on failure
        if: failure()
        run: tail -n 80 perchance.log || true
