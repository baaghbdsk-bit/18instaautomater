name: insights backfill (temporary)

# TEMPORARY: populate the shared insights table, then delete this file.
on:
  push:
    paths:
      - .github/workflows/_insights_backfill.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore sessions
        uses: actions/cache@v4
        with:
          path: sessions
          key: ig-sessions-v3-${{ github.run_id }}
          restore-keys: ig-sessions-v3-

      - name: Seed sessions from secrets
        env:
          IG_USERNAME_1: ${{ secrets.IG_USERNAME_1 }}
          IG_USERNAME_2: ${{ secrets.IG_USERNAME_2 }}
          IG_SESSION_1: ${{ secrets.IG_SESSION_1 }}
          IG_SESSION_2: ${{ secrets.IG_SESSION_2 }}
        run: python bootstrap_sessions.py

      - name: Collect insights for all accounts
        env:
          IG_USERNAME_1: ${{ secrets.IG_USERNAME_1 }}
          IG_PASSWORD_1: ${{ secrets.IG_PASSWORD_1 }}
          IG_USERNAME_2: ${{ secrets.IG_USERNAME_2 }}
          IG_PASSWORD_2: ${{ secrets.IG_PASSWORD_2 }}
        run: |
          python - <<'PY'
          import config, db
          from post_instagram import login_account
          from pipeline import collect_insights

          clients = {}
          for acc in config.ACCOUNTS:
              if acc.get("username") and acc.get("password"):
                  try:
                      clients[acc["name"]] = login_account(acc)
                  except Exception as e:
                      print("login failed", acc["name"], type(e).__name__)
          print("updated", collect_insights(clients, limit=50, min_age_hours=0))
          conn = db.connect()
          print("insights_count", conn.execute(
              "select count(*) from insights").fetchone()[0])
          conn.close()
          db.checkpoint()
          PY

      - name: Commit state
        run: |
          git config user.name "insta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git commit -m "state: insights backfill [skip ci]" || true
          for i in 1 2 3; do git push && break || git pull --rebase --autostash; done
