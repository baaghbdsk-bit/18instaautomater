name: Daily Character X Autopilot

on:
  schedule:
    # Twice daily at 18:00 and 22:00 IST (12:30 and 16:30 UTC)
    - cron: "30 12,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate image only, do not post to X"
        type: boolean
        default: false
      count:
        description: "Number of dry-run variations to generate (1-5)"
        type: string
        default: "1"

concurrency:
  group: x-character-posting
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-x:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest -q

      - name: Start Perchance image API (xvfb — launches headful Chrome)
        run: |
          sudo apt-get install -y -qq xvfb
          if ! command -v google-chrome >/dev/null 2>&1 && \
             ! command -v chromium-browser >/dev/null 2>&1 && \
             ! command -v chromium >/dev/null 2>&1; then
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          fi
          git clone --depth 1 https://github.com/afrozthalam/Perchance-API.git
          pip install -q -r Perchance-API/requirements.txt
          nohup xvfb-run -a -s "-screen 0 1280x1024x24" \
            python Perchance-API/app.py > perchance.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -sf http://127.0.0.1:8000/v1/health | grep -q '"ready": *true'; then
              echo "Perchance ready after ~$((i*2))s"; break
            fi
            sleep 2
          done
          if ! curl -sf http://127.0.0.1:8000/v1/health | grep -q '"ready": *true'; then
            echo "::error::Perchance browser pool never became ready"
            tail -n 120 perchance.log || true
            exit 1
          fi

      - name: Generate & Publish to X
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          IMAGE_PROVIDER: perchance
          X_COOKIES_BASE64: ${{ secrets.X_COOKIES_BASE64 }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          COUNT: ${{ github.event.inputs.count || '1' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python post_x.py --dry-run --count "$COUNT"
          else
            python post_x.py
          fi

      - name: Upload generated preview images (dry-run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: x-preview-${{ github.run_number }}
          path: assets/images/*.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist X variation history
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/x_history.json ]; then
            git add data/x_history.json
            git diff --cached --quiet || git commit -m "chore(x): record used variation [skip ci]"
            git pull --rebase origin main --autostash || true
            git push origin main || true
          fi
