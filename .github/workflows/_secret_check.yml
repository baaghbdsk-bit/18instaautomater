name: secret check

# TEMPORARY diagnostic: reports whether required secrets exist (never values).
on:
  push:
    paths:
      - .github/workflows/_secret_check.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write presence report
        env:
          U1: ${{ secrets.IG_USERNAME_1 }}
          P1: ${{ secrets.IG_PASSWORD_1 }}
          S1: ${{ secrets.IG_SESSION_1 }}
          U2: ${{ secrets.IG_USERNAME_2 }}
          P2: ${{ secrets.IG_PASSWORD_2 }}
          S2: ${{ secrets.IG_SESSION_2 }}
        run: |
          mkdir -p data
          {
            echo "checked_at=$(date -u +%FT%TZ)"
            for pair in "IG_USERNAME_1:U1" "IG_PASSWORD_1:P1" "IG_SESSION_1:S1" \
                        "IG_USERNAME_2:U2" "IG_PASSWORD_2:P2" "IG_SESSION_2:S2"; do
              name="${pair%%:*}"
              var="${pair##*:}"
              val="${!var}"
              if [ -n "$val" ]; then
                echo "$name=SET (len ${#val})"
              else
                echo "$name=MISSING"
              fi
            done
          } > data/secret-check.txt
          cat data/secret-check.txt

      - name: Commit report
        run: |
          git config user.name "insta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/secret-check.txt
          git commit -m "chore: secret presence check [skip ci]" || true
          git push
