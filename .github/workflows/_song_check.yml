name: song and font check (temporary)

on:
  push:
    paths:
      - .github/workflows/_song_check.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger "Scheduled quote post"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post.yml/dispatches" \
            -d '{"ref":"main","inputs":{"slot":"song-font-check"}}'
          echo dispatched
          # retry with log and cap (3)
