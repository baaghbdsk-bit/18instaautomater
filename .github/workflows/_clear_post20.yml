name: clear post 20 error (temporary)

on:
  push:
    paths:
      - .github/workflows/_clear_post20.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Clear stale error
        run: |
          python -c "import db; db.update_post(20, error=None, error_stage=None); print(db.get_post(20)['error'])"
          python -c "import db; db.checkpoint()"

      - name: Commit state
        run: |
          git config user.name "insta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git commit -m "state: clear stale post 20 error [skip ci]" || true
          for i in 1 2 3; do git push && break || git pull --rebase --autostash; done
